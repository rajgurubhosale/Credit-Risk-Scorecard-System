name: Model Promote and Deploy

on:
  workflow_dispatch:
    inputs:
      rollback:
        description: "Rollback: skip metric comparison; staging must point to the rollback version"
        type: boolean
        default: false

permissions:
  contents: read

# Hold the same lock as code deployment through promotion and push.
concurrency:
  group: hf-backend-space
  cancel-in-progress: false
  queue: max

env:
  DAGSHUB_REPO_OWNER: rajgurubhosale
  DAGSHUB_REPO_NAME: Credit-Risk-Scorecard-System
  MLFLOW_MODEL_NAME: CreditRisk-LogisticRegression

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install release dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Check staging and promote
        id: release
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
          SKIP_COMPARE: ${{ inputs.rollback }}
        run: python -m src.pipelines.release_model

  deploy:
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODEL_VERSION: ${{ needs.promote.outputs.version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install download dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Download the approved model version
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
          DAGSHUB_TRACKING_URI: ${{ secrets.DAGSHUB_TRACKING_URI }}
        run: python -m scripts.model_loader --version "$MODEL_VERSION"

      - name: Generate portfolio report
        run: python app/backend/services/portfoilio_analysis.py

      - name: Push only the model artifacts to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
        run: |
          set -euo pipefail
          git config --global user.email "$GIT_EMAIL"
          git config --global user.name "$GIT_USERNAME"

          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 \
            "https://rajguru007:$HF_TOKEN@huggingface.co/spaces/rajguru007/credit-backend" hf-backend
          cd hf-backend
          git lfs install
          git lfs track "*.joblib" "*.pkl" "*.png" "*.csv"

          mkdir -p artifacts
          rsync -a --delete ../app/backend/artifacts/ artifacts/

          git add .gitattributes artifacts/
          git diff --staged --quiet || git commit -m "Release production model"
          git push
