# this file will load the production model from the mlflow dagshub! at time of every push
# that is set manually as production in MLflow
# loads production model and injects into Docker image via CI/CD
# deploys backend and frontend to Hugging Face Spaces

name: Continuos-Deployment Pipeline


on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/**'

  pull_request:
    branches: [ "main" ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: pip install dagshub mlflow-skinny

  
      - name: Load Production Model and Artifacts From mlflow dagshub
        env:
            DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
            DAGSHUB_TRACKING_URI:  ${{ secrets.DAGSHUB_TRACKING_URI }}
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          python scripts/model_loader.py

          # set secrets using github

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "${{ secrets.GIT_EMAIL }}"
          git config --global user.name "${{ secrets.GIT_USERNAME }}"
          
          # Install git lfs
          sudo apt-get install -y git-lfs
          
          # Push backend
          git clone https://rajguru007:$HF_TOKEN@huggingface.co/spaces/rajguru007/credit-backend hf-backend
          cp -r app/backend/. hf-backend/
          cd hf-backend
          git lfs install
          git lfs track "*.pkl" "*.png" "*.csv"
          git add .gitattributes
          git add .
          git diff --staged --quiet || git commit -m "Deploy backend ${{ github.sha }}"
          git push
          cd ..

          # Push frontend
          git clone https://rajguru007:$HF_TOKEN@huggingface.co/spaces/rajguru007/credit-risk-system hf-frontend
          cp -r app/frontend/. hf-frontend/
          cd hf-frontend
          git lfs install
          git lfs track "*.png"
          git add .gitattributes
          git add .
          git diff --staged --quiet || git commit -m "Deploy frontend ${{ github.sha }}"
          git push